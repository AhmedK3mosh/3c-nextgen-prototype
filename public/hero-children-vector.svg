    <g transform="translate(503 95) rotate(7)"><rect width="72" height="72" rx="19" fill="url(#purple)"/><text x="36" y="47" text-anchor="middle" font-size="29">🎮</text></g>
    <g transform="translate(511 233) rotate(10)"><rect width="62" height="62" rx="18" fill="url(#blue)"/><text x="31" y="42" text-anchor="middle" font-size="31" fill="white">★</text></g>

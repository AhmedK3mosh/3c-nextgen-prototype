<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 495" role="img" aria-label="Three 3C students with laptops">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1596ff"/><stop offset="1" stop-color="#0754d8"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd2b8"/><stop offset="1" stop-color="#f3a27c"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b2a1d"/><stop offset="1" stop-color="#23130f"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9c67ff"/><stop offset="1" stop-color="#6337dc"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0b3f8f" flood-opacity=".22"/></filter>
  </defs>

  <ellipse cx="310" cy="452" rx="255" ry="28" fill="#6cc9ff" opacity=".18"/>

